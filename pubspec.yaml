name: crop_shield_ai
description: "AI-powered crop disease detection for farmers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  tflite_flutter: 0.12.0
  image: ^4.0.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.2.2
  flame: ^1.18.0
  sqflite: ^2.3.0
  path: ^1.9.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cropshield_mobilenetv3.tflite
    - assets/class_labels.json
    - assests/game_leaves/
